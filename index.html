<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Mortal Kombat Style Fighter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .player-label {
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 1px;
      margin-bottom: 5px;
      text-transform: uppercase;
      text-shadow: 0 0 5px rgba(0,0,0,0.8);
    }
    .p1-color { color: #00aaff; }
    .p2-color { color: #ff3333; }
    .health-bar {
      width: 40%;
      height: 26px;
      background: rgba(20, 20, 20, 0.8);
      border: 2px solid #555;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      position: relative;
    }
    .health-fill {
      height: 100%;
      width: 100%;
      transition: width 0.15s ease-out;
    }
    #p1-health { background: linear-gradient(90deg, #0055ff, #00aaff); float: left; }
    #p2-health { background: linear-gradient(90deg, #ff3333, #ff6600); float: right; }
    #timer {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 5px 15px;
      border: 2px solid #444;
      border-radius: 6px;
      min-width: 45px;
      text-align: center;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    #controls-info {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      color: #aaa;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid #333;
      z-index: 10;
      text-align: center;
    }
  </style>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <div style="width: 40%;">
      <div class="player-label p1-color">Sub-Zero (P1)</div>
      <div class="health-bar"><div id="p1-health" class="health-fill"></div></div>
    </div>
    <div id="timer">60</div>
    <div style="width: 40%; text-align: right;">
      <div class="player-label p2-color">Scorpion (P2)</div>
      <div class="health-bar"><div id="p2-health" class="health-fill"></div></div>
    </div>
  </div>

  <div id="controls-info">
    <b>P1:</b> A/D Move | W Jump | SPACE Attack &nbsp;|&nbsp; 
    <b>P2:</b> ←/→ Move | ↑ Jump | ENTER Attack
  </div>

  <script>
    // --- SCENE & SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a12);
    scene.fog = new THREE.FogExp2(0x0a0a12, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(0, 20, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 15;
    dirLight.shadow.camera.bottom = -5;
    scene.add(dirLight);

    // Arena Spotlight
    const spotLight1 = new THREE.SpotLight(0x00aaff, 1.5, 30, Math.PI / 4, 0.5);
    spotLight1.position.set(-10, 12, 0);
    scene.add(spotLight1);

    const spotLight2 = new THREE.SpotLight(0xff3300, 1.5, 30, Math.PI / 4, 0.5);
    spotLight2.position.set(10, 12, 0);
    scene.add(spotLight2);

    // --- ENVIRONMENT / ARENA ---
    const floorGeo = new THREE.PlaneGeometry(50, 20);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x222228, roughness: 0.8, metalness: 0.2 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Arena Ring Pillars
    const pillarGeo = new THREE.CylinderGeometry(0.5, 0.5, 12, 16);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x33333d, metalness: 0.8, roughness: 0.2 });
    for (let x of [-15, 15]) {
      for (let z of [-5, 5]) {
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(x, 6, z);
        pillar.castShadow = true;
        scene.add(pillar);
      }
    }

    // --- CHARACTER BUILDER (3D Articulated Fighter) ---
    function createFighter(primaryColor) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: primaryColor, roughness: 0.4, metalness: 0.3 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.7 });
      const jointMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

      // Torso
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), mat);
      torso.position.y = 1.6;
      torso.castShadow = true;
      group.add(torso);

      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), skinMat);
      head.position.y = 2.4;
      head.castShadow = true;
      group.add(head);

      // Mask
      const mask = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.2, 0.32), mat);
      mask.position.set(0, 2.35, 0.1);
      group.add(mask);

      // Arms Helper
      function createArm(isLeft) {
        const armGroup = new THREE.Group();
        armGroup.position.set(isLeft ? -0.55 : 0.55, 2.1, 0);

        const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.6), mat);
        upperArm.position.y = -0.3;
        upperArm.castShadow = true;
        armGroup.add(upperArm);

        const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.6), skinMat);
        forearm.position.y = -0.8;
        forearm.castShadow = true;
        armGroup.add(forearm);

        const fist = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.18), jointMat);
        fist.position.y = -1.15;
        armGroup.add(fist);

        return armGroup;
      }

      // Legs Helper
      function createLeg(isLeft) {
        const legGroup = new THREE.Group();
        legGroup.position.set(isLeft ? -0.25 : 0.25, 1.0, 0);

        const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.7), jointMat);
        thigh.position.y = -0.35;
        thigh.castShadow = true;
        legGroup.add(thigh);

        const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.7), mat);
        shin.position.y = -0.95;
        shin.castShadow = true;
        legGroup.add(shin);

        return legGroup;
      }

      const leftArm = createArm(true);
      const rightArm = createArm(false);
      const leftLeg = createLeg(true);
      const rightLeg = createLeg(false);

      group.add(leftArm);
      group.add(rightArm);
      group.add(leftLeg);
      group.add(rightLeg);

      return { group, leftArm, rightArm, leftLeg, rightLeg };
    }

    // --- FIGHTER CLASS ---
    class Fighter {
      constructor({ x, color, facingRight }) {
        this.meshData = createFighter(color);
        this.mesh = this.meshData.group;
        this.mesh.position.x = x;
        scene.add(this.mesh);

        this.velocity = { x: 0, y: 0 };
        this.facingRight = facingRight;
        this.health = 100;
        this.isGrounded = true;
        this.isAttacking = false;
        this.isHit = false;
        this.animTimer = 0;

        this.updateFacing();
      }

      updateFacing() {
        this.mesh.rotation.y = this.facingRight ? Math.PI / 2 : -Math.PI / 2;
      }

      update() {
        // Physics & Movement
        this.mesh.position.x += this.velocity.x;
        this.mesh.position.y += this.velocity.y;

        // Gravity
        if (this.mesh.position.y > 0) {
          this.velocity.y -= 0.015;
          this.isGrounded = false;
        } else {
          this.mesh.position.y = 0;
          this.velocity.y = 0;
          this.isGrounded = true;
        }

        // Arena Bounds
        if (this.mesh.position.x < -12) this.mesh.position.x = -12;
        if (this.mesh.position.x > 12) this.mesh.position.x = 12;

        // Animations
        this.animTimer += 0.1;
        const { leftArm, rightArm, leftLeg, rightLeg } = this.meshData;

        if (this.isHit) {
          // Hit Reaction Animation
          this.mesh.rotation.z = this.facingRight ? -0.3 : 0.3;
          rightArm.rotation.x = 1.5;
        } else if (this.isAttacking) {
          // Punch Animation
          rightArm.rotation.x = Math.PI / 2;
          rightArm.rotation.z = 0.3;
          leftArm.rotation.x = -0.5;
        } else {
          // Idle & Walking Animations
          this.mesh.rotation.z = 0;
          const walkCycle = Math.sin(this.animTimer * 2) * (this.velocity.x !== 0 ? 0.6 : 0.1);
          
          leftArm.rotation.x = walkCycle;
          rightArm.rotation.x = -walkCycle;
          leftLeg.rotation.x = -walkCycle;
          rightLeg.rotation.x = walkCycle;

          // Default guard pose
          rightArm.rotation.z = -0.3;
          leftArm.rotation.z = 0.3;
        }
      }

      attack(enemy) {
        if (this.isAttacking || this.isHit) return;
        this.isAttacking = true;

        setTimeout(() => {
          // Hitbox Range Check
          const dist = Math.abs(this.mesh.position.x - enemy.mesh.position.x);
          if (dist < 2.0 && Math.abs(this.mesh.position.y - enemy.mesh.position.y) < 1.5) {
            enemy.takeHit(10);
          }
        }, 100);

        setTimeout(() => { this.isAttacking = false; }, 300);
      }

      takeHit(damage) {
        this.health = Math.max(0, this.health - damage);
        this.isHit = true;
        this.velocity.x = this.facingRight ? -0.1 : 0.1;

        setTimeout(() => {
          this.isHit = false;
          this.velocity.x = 0;
        }, 250);
      }
    }

    // Instantiate P1 and P2
    const player1 = new Fighter({ x: -4, color: 0x0077ff, facingRight: true });
    const player2 = new Fighter({ x: 4, color: 0xff2200, facingRight: false });

    // --- CONTROLS ---
    const keys = {
      a: false, d: false,
      ArrowLeft: false, ArrowRight: false
    };

    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        // Player 1
        case 'a': keys.a = true; break;
        case 'd': keys.d = true; break;
        case 'w': if (player1.isGrounded) player1.velocity.y = 0.3; break;
        case ' ': player1.attack(player2); break;

        // Player 2
        case 'ArrowLeft': keys.ArrowLeft = true; break;
        case 'ArrowRight': keys.ArrowRight = true; break;
        case 'ArrowUp': if (player2.isGrounded) player2.velocity.y = 0.3; break;
        case 'Enter': player2.attack(player1); break;
      }
    });

    window.addEventListener('keyup', (e) => {
      switch (e.key) {
        case 'a': keys.a = false; break;
        case 'd': keys.d = false; break;
        case 'ArrowLeft': keys.ArrowLeft = false; break;
        case 'ArrowRight': keys.ArrowRight = false; break;
      }
    });

    // Dynamic Camera Tracking
    function updateCamera() {
      const midPointX = (player1.mesh.position.x + player2.mesh.position.x) / 2;
      const dist = Math.abs(player1.mesh.position.x - player2.mesh.position.x);
      
      camera.position.x = midPointX;
      camera.position.z = Math.max(8, dist + 4);
      camera.position.y = 3 + dist * 0.1;
      camera.lookAt(midPointX, 1.8, 0);
    }

    // UI Update Loop
    function updateUI() {
      document.getElementById('p1-health').style.width = player1.health + '%';
      document.getElementById('p2-health').style.width = player2.health + '%';
    }

    // Match Timer
    let timeLeft = 60;
    setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
      }
    }, 1000);

    // --- MAIN GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // P1 Input Handling
      player1.velocity.x = 0;
      if (keys.a) player1.velocity.x = -0.08;
      if (keys.d) player1.velocity.x = 0.08;

      // P2 Input Handling
      player2.velocity.x = 0;
      if (keys.ArrowLeft) player2.velocity.x = -0.08;
      if (keys.ArrowRight) player2.velocity.x = 0.08;

      // Ensure fighters turn towards each other
      player1.facingRight = player1.mesh.position.x < player2.mesh.position.x;
      player2.facingRight = player2.mesh.position.x < player1.mesh.position.x;
      player1.updateFacing();
      player2.updateFacing();

      player1.update();
      player2.update();

      updateCamera();
      updateUI();

      renderer.render(scene, camera);
    }

    // Responsive Canvas Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
