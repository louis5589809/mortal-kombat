<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Fighter - AI Opponent</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    #ui {
      position: absolute; top: 20px; left: 0; width: 100%;
      display: flex; justify-content: space-between; padding: 0 40px; box-sizing: border-box;
    }
    .health-bar-container {
      width: 40%; height: 30px; background: #333; border: 2px solid #fff; border-radius: 4px; overflow: hidden;
    }
    .health-bar { width: 100%; height: 100%; background: #d32f2f; transition: width 0.1s; }
    #p2-health { float: right; background: #1976d2; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">
  <div class="health-bar-container"><div id="p1-health" class="health-bar"></div></div>
  <div class="health-bar-container"><div id="p2-health" class="health-bar"></div></div>
</div>

<script>
// --- Scene & Camera Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a24);
scene.fog = new THREE.FogExp2(0x1a1a24, 0.03);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(0, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

// Floor
const floorGeo = new THREE.PlaneGeometry(50, 20);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// --- Fighter Class ---
class Fighter {
  constructor(x, color, isPlayer2 = false) {
    this.isPlayer2 = isPlayer2;
    this.health = 100;
    this.position = new THREE.Vector3(x, 0, 0);
    this.velocity = new THREE.Vector3();
    this.isGrounded = true;
    this.isAttacking = false;
    this.animTime = 0;

    // Group Container
    this.mesh = new THREE.Group();
    this.mesh.position.copy(this.position);
    scene.add(this.mesh);

    // Build Character Body
    const mat = new THREE.MeshStandardMaterial({ color: color });

    this.torso = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.6), mat);
    this.torso.position.y = 1.75;
    this.torso.castShadow = true;
    this.mesh.add(this.torso);

    this.head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), mat);
    this.head.position.y = 2.8;
    this.mesh.add(this.head);

    this.leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3), mat);
    this.leftArm.position.set(-0.8, 1.8, 0);
    this.mesh.add(this.leftArm);

    this.rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3), mat);
    this.rightArm.position.set(0.8, 1.8, 0);
    this.mesh.add(this.rightArm);

    this.leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), mat);
    this.leftLeg.position.set(-0.3, 0.6, 0);
    this.mesh.add(this.leftLeg);

    this.rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), mat);
    this.rightLeg.position.set(0.3, 0.6, 0);
    this.mesh.add(this.rightLeg);
  }

  update(opponent) {
    // Movement Physics
    this.position.add(this.velocity);
    this.velocity.y -= 0.015; // Gravity

    if (this.position.y <= 0) {
      this.position.y = 0;
      this.velocity.y = 0;
      this.isGrounded = true;
    }

    // Stage Boundaries
    this.position.x = Math.max(-12, Math.min(12, this.position.x));
    this.mesh.position.copy(this.position);

    // Face Opponent
    if (opponent) {
      this.mesh.rotation.y = this.position.x < opponent.position.x ? Math.PI / 2 : -Math.PI / 2;
    }

    // Animations
    this.animTime += 0.1;
    if (this.isGrounded && !this.isAttacking) {
      if (Math.abs(this.velocity.x) > 0.01) {
        this.leftLeg.rotation.x = Math.sin(this.animTime) * 0.5;
        this.rightLeg.rotation.x = -Math.sin(this.animTime) * 0.5;
        this.leftArm.rotation.x = -Math.sin(this.animTime) * 0.5;
        this.rightArm.rotation.x = Math.sin(this.animTime) * 0.5;
      } else {
        this.torso.position.y = 1.75 + Math.sin(this.animTime * 0.5) * 0.05;
        this.leftArm.rotation.x = 0;
        this.rightArm.rotation.x = 0;
        this.leftLeg.rotation.x = 0;
        this.rightLeg.rotation.x = 0;
      }
    }
  }

  attack(opponent) {
    if (this.isAttacking) return;
    this.isAttacking = true;

    const attackArm = this.mesh.rotation.y > 0 ? this.rightArm : this.leftArm;
    attackArm.rotation.z = -Math.PI / 3;
    attackArm.position.z = 0.8;

    const dist = this.position.distanceTo(opponent.position);
    if (dist < 2.2) {
      opponent.takeDamage(10);
    }

    setTimeout(() => {
      attackArm.rotation.z = 0;
      attackArm.position.z = 0;
      this.isAttacking = false;
    }, 200);
  }

  takeDamage(amount) {
    this.health = Math.max(0, this.health - amount);
    const elemId = this.isPlayer2 ? 'p2-health' : 'p1-health';
    document.getElementById(elemId).style.width = this.health + '%';
    
    this.position.x += this.mesh.rotation.y > 0 ? -0.3 : 0.3;
  }
}

// Spawn Players
const p1 = new Fighter(-3, 0xd32f2f, false);
const p2 = new Fighter(3, 0x1976d2, true);

// --- AI Opponent Logic ---
let aiCooldown = false;

function updateAI() {
  const dist = p2.position.distanceTo(p1.position);
  const strikeDistance = 1.8;

  // Reset horizontal velocity
  p2.velocity.x = 0;

  // Move toward Player 1 if out of range
  if (dist > strikeDistance) {
    if (p2.position.x < p1.position.x) {
      p2.velocity.x = 0.07; // Move Right
    } else {
      p2.velocity.x = -0.07; // Move Left
    }
  } else {
    // Attack when in range with a randomized delay
    if (!aiCooldown) {
      aiCooldown = true;
      p2.attack(p1);

      // Randomize jump occasionally
      if (Math.random() < 0.3 && p2.isGrounded) {
        p2.velocity.y = 0.3;
        p2.isGrounded = false;
      }

      // Attack cooldown timer (500ms - 1200ms)
      setTimeout(() => {
        aiCooldown = false;
      }, 500 + Math.random() * 700);
    }
  }
}

// --- Controls (Player 1 Only) ---
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function handlePlayerInput() {
  p1.velocity.x = 0;
  if (keys['KeyA']) p1.velocity.x = -0.1;
  if (keys['KeyD']) p1.velocity.x = 0.1;
  if (keys['KeyW'] && p1.isGrounded) { p1.velocity.y = 0.35; p1.isGrounded = false; }
  if (keys['Space']) p1.attack(p2);
}

// --- Main Loop ---
function animate() {
  requestAnimationFrame(animate);

  handlePlayerInput();
  updateAI();

  p1.update(p2);
  p2.update(p1);

  // Camera tracking
  const midX = (p1.position.x + p2.position.x) / 2;
  const dist = Math.abs(p1.position.x - p2.position.x);
  
  camera.position.x = midX;
  camera.position.z = Math.max(8, dist + 4);
  camera.position.y = 3;
  camera.lookAt(midX, 1.5, 0);

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
