<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow Arena 3D</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509;font-family:Arial,sans-serif}
canvas{display:block}

#hud{
  position:fixed;top:18px;left:0;width:100%;
  display:flex;align-items:center;justify-content:center;
  gap:22px;z-index:5;pointer-events:none
}

.bar{
  width:min(38vw,430px);height:30px;
  background:#17171d;border:3px solid #eee;
  box-shadow:0 0 15px #000;position:relative
}
.health{
  width:100%;height:100%;
  background:linear-gradient(90deg,#23e56b,#ffe34a,#ff3939);
  transition:width .12s
}
.name{
  position:absolute;top:-25px;font-size:13px;
  font-weight:bold;text-shadow:2px 2px 4px #000
}
.left .name{left:0}
.right .name{right:0}

#round{
  position:fixed;top:58px;left:50%;
  transform:translateX(-50%);
  color:#fff;font-weight:bold;letter-spacing:3px;
  text-shadow:0 0 10px #f44;z-index:5
}

#message{
  position:fixed;left:50%;top:42%;
  transform:translate(-50%,-50%);
  color:#fff;font-size:54px;font-weight:900;
  text-shadow:0 5px 20px #000,0 0 25px #ff3045;
  z-index:10;display:none
}

#controls{
  position:fixed;bottom:15px;left:50%;
  transform:translateX(-50%);
  color:#bbb;background:#08080ccc;
  padding:9px 15px;border:1px solid #333;
  border-radius:8px;font-size:13px;z-index:5
}
</style>
</head>

<body>

<div id="hud">
  <div class="bar left">
    <div class="name">RAVEN</div>
    <div id="pHealth" class="health"></div>
  </div>

  <div id="round">ROUND 1</div>

  <div class="bar right">
    <div class="name">IRON WRAITH</div>
    <div id="aHealth" class="health"></div>
  </div>
</div>

<div id="message"></div>

<div id="controls">
  A / D Move &nbsp; • &nbsp;
  W Jump &nbsp; • &nbsp;
  J Punch &nbsp; • &nbsp;
  K Kick &nbsp; • &nbsp;
  L Block
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
